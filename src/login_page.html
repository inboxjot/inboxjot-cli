<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}} — Inboxjot</title>
<style>
  :root {
    --page: #0f0f0f;
    --surface: #141414;
    --code: #121212;
    --ring: rgba(255, 255, 255, 0.08);
    --border: #232323;
    --text: #ededed;
    --text-secondary: #a3a3a3;
    --text-tertiary: #6b6b6b;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding: 40px;
  }
  header { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header svg { width: 22px; height: 22px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px; }
  .tiles { display: flex; align-items: center; gap: 12px; color: var(--text-tertiary); font-size: 13px; line-height: 20px; font-weight: 500; }
  .tile {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--ring), 0 1px 2px rgba(0, 0, 0, 0.4);
    color: var(--text);
  }
  .tile .icon { width: 16px; height: 16px; }
  .tile .mark { width: 24px; height: 24px; }
  .heading { display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; }
  p { margin: 0; color: var(--text-secondary); font-size: 13px; line-height: 20px; letter-spacing: -0.01em; }
  .command {
    align-self: flex-start; display: flex; gap: 8px; padding: 10px 14px; border-radius: 12px;
    background: var(--code); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 13px; line-height: 17px;
  }
  .command span { color: var(--text-tertiary); user-select: none; }
  footer { color: var(--text-tertiary); font-size: 12px; line-height: 16px; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <g transform="rotate(-90 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(-45 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(0 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(45 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(90 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(135 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(180 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
    <g transform="rotate(225 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
  </svg>
  Inboxjot
</header>
<main>
  <div class="card">
    <div class="tiles">
      <div class="tile">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.67 11.33L5.61 8.39C6.19 7.81 6.19 6.86 5.61 6.27L2.67 3.33"/>
          <path d="M8 12.67H13.33"/>
        </svg>
      </div>
      ···
      <div class="tile">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <g transform="rotate(-90 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(-45 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(0 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(45 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(90 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(135 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(180 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
          <g transform="rotate(225 12 12)"><rect x="8.52" y="8.52" width="15.48" height="6.96" rx="3.48" fill="#F13F34"/></g>
        </svg>
      </div>
    </div>
    <div class="heading">
      <h1>{{title}}</h1>
      <p>{{body}}</p>
    </div>
    <div class="command"><span>$</span>{{command}}</div>
  </div>
</main>
<footer>You can disconnect the CLI at any time in Connected Apps.</footer>
</body>
</html>
