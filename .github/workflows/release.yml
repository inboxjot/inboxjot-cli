name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.1

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-15 }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-15 }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
      - run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --target ${{ matrix.target }}
      - run: cargo +${{ env.RUST_TOOLCHAIN }} build --release --locked --target ${{ matrix.target }} --bin inboxjot
      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p out/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/inboxjot${{ startsWith(matrix.platform, 'win32') && '.exe' || '' }} out/${{ matrix.platform }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - run: node .github/scripts/generate-packages.ts "${GITHUB_REF_NAME#v}" artifacts dist
      - name: Publish to npm
        run: |
          for tarball in $(jq -r '.[]' dist/tarballs.json); do
            npm publish "$tarball" --access public
          done
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/inboxjot/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/inboxjot.rb tap/Formula/inboxjot.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/inboxjot.rb
          git commit -m "chore: release inboxjot ${GITHUB_REF_NAME}"
          git push
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
