[package]
name = "inboxjot-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The Inboxjot command-line interface."
license = "MIT"
repository = "https://github.com/inboxjot/inboxjot-cli"
homepage = "https://inboxjot.com"
readme = "README.md"
keywords = ["email", "inboxjot", "cli"]
categories = ["command-line-utilities", "email"]
publish = false

[lib]
name = "inboxjot_cli"

[[bin]]
name = "inboxjot"
path = "src/main.rs"

[[bin]]
name = "ij"
path = "src/bin/ij.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = "4.6.11"
csv = "1.4.0"
etcetera = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gethostname = "1.1.0"
getrandom = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
inboxjot = { version = "0.2", default-features = false, features = ["webhooks"] }
crossterm = "0.29.0"
indicatif = "0.18.6"
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
jiff = "0.2.41"
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-std", "io-util", "net", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-width = "0.2.3"
uuid = { version = "1.29.1", features = ["v4"] }
webbrowser = "1.2.6"
webpki-root-certs = "1.0.12"
which = "8.0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4.2.0"

[dev-dependencies]
assert_cmd = "2.2.2"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder"] }
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
manual_range_contains = "allow"
wildcard_in_or_patterns = "allow"
as_underscore = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
deref_by_slicing = "warn"
disallowed_methods = "warn"
doc_markdown = "warn"
elidable_lifetime_names = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
get_unwrap = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_is_variant_and = "warn"
match_wildcard_for_single_variants = "warn"
mut_mut = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
range_plus_one = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
semicolon_if_nothing_returned = "warn"
stable_sort_primitive = "warn"
uninlined_format_args = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnested_or_patterns = "warn"
unseparated_literal_suffix = "warn"
